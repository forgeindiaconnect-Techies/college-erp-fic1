<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-grad-primary" x1="12" y1="12" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="logo-glow" x="6" y="6" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern ERP Tech Monogram Emblem -->
  <g filter="url(#logo-glow)">
    <rect x="12" y="12" width="36" height="36" rx="9" fill="url(#logo-grad-primary)" />
    
    <!-- Stylized Geometric "E" monogram -->
    <path d="M 22 21 L 38 21" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 22 30 L 33 30" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 22 39 L 38 39" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 22 21 L 22 39" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
    
    <!-- Tech Accent Node -->
    <circle cx="38" cy="30" r="2.2" fill="#E0F2FE" />
  </g>

  <!-- Crisp Brand Typography: ERPSYS -->
  <text x="56" y="41" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="0.5">
    <tspan fill="#FFFFFF">ERP</tspan><tspan fill="#38BDF8">SYS</tspan>
  </text>
</svg>
